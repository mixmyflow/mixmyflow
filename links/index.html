<style>
  :root{
    --bg:#0A0A0B; --ink:#F2F0EC; --muted:#9A968F; --line:#2A2A2D; --orange:#F08A3C; --orange-dark:#C96A22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:'Barlow Condensed',system-ui,sans-serif;
    min-height:100svh;display:flex;justify-content:center;
    padding:48px 20px 32px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}

  .retrato{
    width:132px;height:132px;border-radius:50%;object-fit:cover;
    border:3px solid var(--orange);padding:4px;background:var(--bg);
  }
  h1{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:46px;letter-spacing:.08em;text-transform:uppercase;
    margin-top:20px;line-height:1;
  }
  .sub{
    color:var(--muted);font-size:18px;letter-spacing:.06em;text-transform:uppercase;
    margin-top:8px;text-align:center;
  }

  .botones{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:36px}
  .btn{
    display:block;width:100%;text-decoration:none;border-radius:14px;
    text-align:center;transition:transform .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(.98)}

  .btn-estudio{
    background:var(--orange);color:#140A02;padding:22px 20px 18px;
    box-shadow:0 10px 30px -12px rgba(240,138,60,.55);
  }
  .btn-estudio:hover{background:#F59A50}
  .btn-estudio .titulo{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:26px;
    text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.1;
  }
  .btn-estudio .detalle{
    display:block;font-size:17px;font-weight:600;margin-top:6px;opacity:.82;letter-spacing:.02em;
  }
  .btn-estudio .agenda{
    display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;
    background:#140A02;color:var(--orange);
    font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;letter-spacing:.04em;
  }
  .btn-estudio .marca{
    display:block;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    margin-bottom:6px;opacity:.7;
  }

  .btn-musica{
    border:2px solid var(--line);color:var(--ink);padding:16px 20px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .btn-musica:hover{border-color:var(--muted)}
  .btn-musica svg{width:22px;height:22px;fill:#1ED760;flex:none}
  .btn-musica span{
    font-family:'Oswald',sans-serif;font-weight:500;font-size:20px;
    text-transform:uppercase;letter-spacing:.05em;
  }

  .redes{display:flex;gap:26px;margin-top:44px}
  .redes a{display:block;padding:6px;line-height:0}
  .redes svg{width:24px;height:24px;fill:var(--muted);transition:fill .12s ease}
  .redes a:hover svg{fill:var(--ink)}

  footer{margin-top:28px;color:#55524D;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
</style>

<script>
  // Registra cada clic en Google Analytics y en el píxel de Meta antes de salir.
  // Eventos: "clic_boton" en GA (con el nombre del botón) y "ClicEstudio"/"ClicSpotify"/"ClicRedes" en Meta.
  var eventosMeta = {estudio:'ClicEstudio', spotify:'ClicSpotify'};
  document.querySelectorAll('a[data-boton]').forEach(function(a){
    a.addEventListener('click', function(e){
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      var boton = a.getAttribute('data-boton');
      var destino = a.href;
      e.preventDefault();
      var fuera = false;
      function ir(){ if(!fuera){ fuera = true; window.location.href = destino; } }
      try { gtag('event', 'clic_boton', {boton: boton, transport_type: 'beacon', event_callback: ir}); } catch(_){}
      try { fbq('trackCustom', eventosMeta[boton] || 'ClicRedes', {boton: boton}); } catch(_){}
      setTimeout(ir, 300);
    });
  });
</script>
